    const state={screen:'home',cart:[],selected:null,overlay:null,role:'Acheteur',lang:'FR',search:'',payment:'Mobile Money',orders:[],onboard:0,token:storedToken,phone:'',demoCode:'',submittingOrder:false};
    const app=document.getElementById('app');
    const money=n=>new Intl.NumberFormat('fr-FR').format(n)+' CDF';
    async function api(path,options={}){if(!apiOnline)throw new Error('Mode hors ligne');const headers={'content-type':'application/json',...(options.headers||{})};if(state.token)headers.authorization='Bearer '+state.token;const response=await fetch(apiBase+path,{...options,headers});const data=await response.json();if(!response.ok)throw new Error(data.error||'Erreur réseau');return data}
    async function loadOperationalData(){if(!apiOnline)return;const data=await api('/api/products');products=data.products;saveProducts();state.orders=[];if(state.token){const orderData=await api('/api/orders');state.orders=orderData.orders.map(order=>({name:order.items[0]?.name||'Commande TekaSafe',id:'#'+order.id,status:order.status,tone:'blue',emoji:'🛍️'}))}}
    function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    function icon(name){return name}
    function productCard(p){return `<button class="product" onclick="openProduct(${p.id})" aria-label="Voir ${p.name}"><div class="product-image ${p.tone}"><span class="tag">${p.tag}</span><span class="heart">♡</span>${p.emoji}</div><div class="product-info"><div class="product-name">${p.name}</div><div class="product-price">${money(p.price)}</div><div class="product-meta"><span>${p.vehicle?'🚘 '+p.year+' · '+p.km+' km':'📍 '+p.area}</span><span class="verified">✓ ${p.rating}</span></div></div></button>`}
    function topbar(){return `<header class="topbar"><button class="brand" onclick="go('home')" aria-label="Accueil TekaSafe"><span class="mark">✓</span>TekaSafe</button><div class="top-actions"><button class="lang" onclick="toggleLang()">${state.lang}</button><button class="icon-btn" onclick="showToast('Notifications : votre commande arrive bientôt')" aria-label="Notifications">🔔<i class="badge">2</i></button></div></header>`}
    function nav(){const items=[['home','⌂','Accueil'],['orders','◫','Commandes'],['messages','✉','Messages'],['profile','☺','Profil']];return `<nav class="bottom-nav" aria-label="Navigation principale">${items.map(([id,ico,label])=>`<button class="nav-item ${state.screen===id?'active':''}" onclick="go('${id}')"><span>${ico}</span>${label}${id==='messages'?'<i class="dot">1</i>':''}</button>`).join('')}</nav>`}
    function home(){const filtered=products.filter(p=>(!state.search||p.name.toLowerCase().includes(state.search.toLowerCase())||p.category.toLowerCase().includes(state.search.toLowerCase())));return `<section class="page"><div class="hero"><small>Kinshasa, RDC</small><h1>Le bon achat commence par la confiance.</h1><p>Vendeurs vérifiés, livraison suivie et paiement sécurisé en démo.</p><div class="safe-pill"><span>●</span> Paiement à la réception disponible</div></div><div class="search"><span>⌕</span><input value="${state.search}" oninput="searchProducts(this.value)" placeholder="Que cherchez-vous ?"><button onclick="showToast('Recherche lancée')">⌕</button></div><div class="location"><span>Livraison vers <strong>Gombe</strong></span><button class="filter" onclick="showToast('Choisissez votre quartier')">Modifier</button></div><div class="section-head"><h2>Explorer par catégorie</h2><button onclick="showToast('Toutes les catégories sont disponibles')">Voir tout</button></div><div class="categories">${categories.map(c=>`<button class="category" onclick="filterCategory('${c[1]}')"><i>${c[0]}</i>${c[1]}</button>`).join('')}</div><div class="section-head"><h2>${state.search?'Résultats':'Recommandés pour vous'}</h2><button onclick="showToast('Produits classés par popularité')">Trier</button></div><div class="products">${filtered.map(productCard).join('')||'<p class="subtext">Aucun produit trouvé. Essayez un autre mot-clé.</p>'}</div><div class="trust-row"><div class="trust"><i>✓</i><b>Vendeurs vérifiés</b>Identité contrôlée</div><div class="trust"><i>◉</i><b>Livraison suivie</b>Code de réception</div><div class="trust"><i>⚑</i><b>Litige assisté</b>Équipe TekaSafe</div></div></section>`}
    function orders(){return `<section class="page"><h1 class="screen-title">Mes commandes</h1><p class="subtext">Statut enregistré de vos commandes.</p>${state.orders.length?state.orders.map(o=>`<article class="order"><div class="order-top"><div><h3>${escapeHtml(o.name)}</h3><p>${escapeHtml(o.id)}</p></div><span class="status ${o.status==='Livrée'?'success':'progress'}">${escapeHtml(o.status)}</span></div></article>`).join(''):'<p class="subtext">Aucune commande enregistrée.</p>'}<div class="seller-banner"><h3>Suivi de livraison</h3><p>Le suivi du livreur et la gestion des litiges ne sont pas encore disponibles dans cette version.</p></div></section>`}
    function messages(){return `<section class="page"><h1 class="screen-title">Messages</h1><p class="subtext">Discutez avec les vendeurs sans quitter TekaSafe.</p><div>${[['Kin Tech Store','Votre iPhone est disponible.','10:42','📱'],['Maman Sifa Mode','Merci pour votre commande !','Hier','👗'],['TekaLivraison','Je serai à Gombe dans 18 minutes.','Hier','🛵']].map((m,i)=>`<button class="message" style="width:100%;background:transparent;text-align:left" onclick="openChat('${m[0]}','${m[3]}')"><span class="avatar">${m[3]}</span><span class="message-main"><b>${m[0]} ${i===0?'<span class="verified">✓</span>':''}</b><p>${m[1]}</p></span><time>${m[2]}</time></button>`).join('')}</div></section>`}
    function profile(){if(state.role==='Vendeur')return seller(); if(state.role==='Livreur')return courier(); if(state.role==='Admin')return admin();return `<section class="page"><div class="profile-card"><div class="user"><div class="profile-avatar">JM</div><div><h2>Jean-Marc Mbuyi</h2><p>Client TekaSafe depuis août 2026</p></div></div><div class="profile-stats"><div><b>4</b><span>Commandes</span></div><div><b>3</b><span>Avis donnés</span></div><div><b>100%</b><span>Profil complet</span></div></div></div>${roleSwitcher()}<div class="settings"><button onclick="showToast('Profil modifiable dans la version connectée')">Mon profil <span>›</span></button><button onclick="showToast('Adresses : Gombe, Kinshasa')">Mes adresses <span>›</span></button><button onclick="showToast('Mobile Money simulé : Airtel Money')">Moyens de paiement <span>›</span></button><button onclick="showToast('Centre de sécurité ouvert')">Centre de sécurité <span>›</span></button><button onclick="resetDemo()">Réinitialiser la démo <span>›</span></button></div></section>`}
    function roleSwitcher(){return `<div class="switcher">${['Acheteur','Vendeur','Livreur','Admin'].map(r=>`<button class="${state.role===r?'active':''}" onclick="setRole('${r}')">${r}</button>`).join('')}</div>`}
    function seller(){const listings=products.filter(p=>p.seller==='Kin Tech Store'||p.seller==='Auto Kin RDC');return `<section class="page"><h1 class="screen-title">Ma boutique</h1><div class="seller-banner"><h3>Kin Tech Store <span class="verified">✓ Vérifié</span></h3><p>218 ventes · 4,9/5 · Gombe. Vous recevez le paiement après confirmation de livraison.</p></div>${roleSwitcher()}<div class="metrics"><div class="metric"><b>12</b><span>Commandes</span></div><div class="metric"><b>482k</b><span>Ventes CDF</span></div><div class="metric"><b>${listings.length}</b><span>Annonces actives</span></div></div><div class="section-head"><h2>Mes annonces</h2><button onclick="showToast('Modifiez une annonce à tout moment')">Comment ça marche ?</button></div><div class="admin-list">${listings.map(p=>`<div class="admin-row"><div><b>${p.emoji} ${p.name}</b><span>${money(p.price)} · ${p.category}${p.vehicle?' · '+p.year+' · '+p.km+' km':''}</span></div><button class="secondary" onclick="openProductEditor(${p.id})">Modifier</button></div>`).join('')}</div><div class="section-head"><h2>Commandes à traiter</h2><button onclick="showToast('Toutes les commandes')">Voir tout</button></div><article class="order"><div class="order-top"><div><h3>Casque Bluetooth Pro</h3><p>#TK-2104 · Client : Amina</p></div><span class="status progress">À préparer</span></div><button class="primary full" style="margin-top:14px" onclick="showToast('Commande marquée comme prête')">Marquer comme prête</button></article><button class="primary full" onclick="openAddProduct()">＋ Ajouter une annonce</button></section>`}
    function courier(){return `<section class="page"><h1 class="screen-title">Mes livraisons</h1><div class="seller-banner"><h3>TekaLivraison</h3><p>Vous êtes en ligne · Gombe et Ngaliema · note 4,9/5</p></div>${roleSwitcher()}<div class="metrics"><div class="metric"><b>3</b><span>À livrer</span></div><div class="metric"><b>8</b><span>Aujourd’hui</span></div><div class="metric"><b>84k</b><span>Gains CDF</span></div></div><article class="order"><div class="order-top"><div><h3>iPhone 13 128 Go</h3><p>Kin Tech Store → Jean-Marc, Gombe</p></div><span class="status progress">En route</span></div><div class="track"><i class="step done"></i><i class="step done"></i><i class="step done"></i><i class="step"></i></div><button class="primary full" style="margin-top:14px" onclick="showToast('Code de réception requis : 4 chiffres')">Saisir le code de réception</button></article></section>`}
    function admin(){return `<section class="page"><h1 class="screen-title">Administration</h1><p class="subtext">Vue opérationnelle - données de démonstration.</p>${roleSwitcher()}<div class="metrics"><div class="metric"><b>1 284</b><span>Utilisateurs</span></div><div class="metric"><b>86</b><span>Vendeurs vérifiés</span></div><div class="metric"><b>7</b><span>Litiges ouverts</span></div></div><div class="section-head"><h2>À examiner</h2><button onclick="showToast('Liste complète')">Tout voir</button></div><div class="admin-list"><div class="admin-row"><div><b>Vérification : Chez Beni</b><span>Nouveau vendeur · Lemba</span></div><button class="secondary" onclick="showToast('Vendeur approuvé')">Approuver</button></div><div class="admin-row"><div><b>Litige #TK-1910</b><span>Produit non conforme</span></div><button class="secondary" onclick="showToast('Litige ouvert')">Voir</button></div><div class="admin-row"><div><b>Commande #TK-2048</b><span>Paiement en attente</span></div><button class="secondary" onclick="showToast('Détail de la commande')">Voir</button></div></div></section>`}
    function render(){let content=state.screen==='home'?home():state.screen==='orders'?orders():state.screen==='messages'?messages():profile();app.innerHTML=topbar()+content+nav()+(state.overlay||'');}
    function go(screen){state.screen=screen;render();window.scrollTo(0,0)}
    function toggleLang(){state.lang=state.lang==='FR'?'LN':'FR';showToast(state.lang==='LN'?'Lokota: Lingala':'Langue : Français');render()}
    function setRole(role){state.role=role;state.screen='profile';render()}
    function searchProducts(v){state.search=v;render()}
    function filterCategory(cat){state.search=cat;render();document.querySelector('.products')?.scrollIntoView({behavior:'smooth',block:'start'})}
    function openProduct(id){const p=products.find(x=>x.id===id);state.selected=p;const vehicleDetails=p.vehicle?`<div class="detail-meta"><span>📅 ${p.year}</span><span>🧭 ${p.km} km</span><span>⛽ ${p.fuel}</span><span>⚙️ ${p.gearbox}</span></div>`:'';const action=p.vehicle?`<button class="primary" onclick="showToast('Demande de rendez-vous envoyée à ${p.seller}')">Demander un essai</button>`:`<button class="primary" onclick="addCart(${p.id});openCart()">Ajouter au panier</button>`;state.overlay=`<div class="overlay"><section class="sheet"><div class="handle"></div><div class="sheet-header"><h2>${p.vehicle?'Véhicule d’occasion':'Détail du produit'}</h2><button class="close" onclick="closeOverlay()">×</button></div><div class="big-product ${p.tone}"><span class="tag">${p.tag}</span>${p.emoji}</div><div class="price-line"><h3>${p.name}</h3><b>${money(p.price)}</b></div><div class="detail-meta"><span>📍 ${p.area}</span><span>🛵 ${p.delivery}</span><span>${p.vehicle?'🔎 Inspection possible':'📦 '+p.stock+' disponibles'}</span></div>${vehicleDetails}<div class="seller-mini"><span class="avatar">${p.seller[0]}</span><span><b>${p.seller} <span class="verified">✓</span></b><p>Vendeur vérifié · ${p.rating}/5 · ${p.sales} ventes</p></span><button class="secondary" onclick="openChat('${p.seller}','${p.emoji}')">Message</button></div><p class="detail-description">${p.description||'Produit contrôlé par le vendeur. TekaSafe garde votre paiement en attente jusqu’à la confirmation de réception avec votre code personnel.'}</p><div class="sticky-action"><button class="secondary" onclick="openChat('${p.seller}','${p.emoji}')">Message</button>${action}</div></section></div>`;render()}
    function closeOverlay(){state.overlay=null;render()}
    function addCart(id){const existing=state.cart.find(x=>x.id===id);if(existing)existing.qty++;else state.cart.push({...products.find(x=>x.id===id),qty:1});showToast('Ajouté au panier');}
    function openCart(){if(!state.cart.length){showToast('Votre panier est vide');return}const total=state.cart.reduce((s,x)=>s+x.price*x.qty,0);state.overlay=`<div class="overlay"><section class="sheet"><div class="handle"></div><div class="sheet-header"><h2>Mon panier</h2><button class="close" onclick="closeOverlay()">×</button></div>${state.cart.map(p=>`<div class="cart-item"><div class="cart-img ${p.tone}">${p.emoji}</div><div><b>${p.name}</b><small>Vendu par ${p.seller}</small><strong>${money(p.price)}</strong></div><div class="cart-qty"><button onclick="changeQty(${p.id},-1)">−</button><span>${p.qty}</span><button onclick="changeQty(${p.id},1)">+</button></div></div>`).join('')}<div class="summary"><div class="sumrow"><span>Sous-total</span><span>${money(total)}</span></div><div class="sumrow"><span>Livraison</span><span>10 000 CDF</span></div><div class="sumrow total"><span>Total</span><span>${money(total+10000)}</span></div></div><button class="primary full" onclick="openCheckout()">Continuer vers le paiement</button></section></div>`;render()}
    function changeQty(id,delta){const item=state.cart.find(x=>x.id===id);if(!item)return;item.qty+=delta;if(item.qty<=0)state.cart=state.cart.filter(x=>x.id!==id);if(!state.cart.length){closeOverlay();showToast('Votre panier est vide.');return}openCart()}
    function openCheckout(){const total=state.cart.reduce((s,x)=>s+x.price*x.qty,0)+10000;state.overlay=`<div class="overlay"><section class="sheet"><div class="handle"></div><div class="sheet-header"><h2>Paiement sécurisé</h2><button class="close" onclick="closeOverlay()">×</button></div><p class="subtext" style="margin-top:10px">Votre paiement reste <b>en attente</b> jusqu’à votre code de réception. Démonstration uniquement.</p><div class="payment-options">${[['Mobile Money','Airtel Money, Orange Money ou M-Pesa','📲'],['À la livraison','Payez lorsque le livreur arrive','🛵']].map(([title,sub,ico])=>`<button class="payment ${state.payment===title?'selected':''}" onclick="state.payment='${title}';openCheckout()"><i>${ico}</i><span><b>${title}</b><span>${sub}</span></span><i class="radio"></i></button>`).join('')}</div><div class="summary"><div class="sumrow total"><span>Total à payer</span><span>${money(total)}</span></div></div><button class="primary full" onclick="confirmOrder()">Confirmer la commande</button><p class="tiny" style="color:var(--muted);text-align:center">En confirmant, vous acceptez les conditions de TekaSafe.</p></section></div>`;render()}
    async function confirmOrder(){if(state.submittingOrder)return;if(!apiOnline||!state.token){showToast('Connectez-vous au serveur pour enregistrer votre commande.');return}if(!state.cart.length){showToast('Votre panier est vide.');return}state.submittingOrder=true;try{const data=await api('/api/orders',{method:'POST',body:JSON.stringify({items:state.cart.map(({id,qty})=>({id,qty})),payment:state.payment})});state.orders.unshift({name:data.order.items[0]?.name||'Commande TekaSafe',id:'#'+data.order.id,status:data.order.status,tone:'blue',emoji:'🛍️'});state.cart=[];state.overlay=null;state.screen='orders';render();showToast('Commande enregistrée. Aucun paiement en ligne effectué.')}catch(error){showToast(error.message)}finally{state.submittingOrder=false}}
    function showTracking(name){state.overlay=`<div class="overlay"><section class="sheet"><div class="handle"></div><div class="sheet-header"><h2>Suivi de livraison</h2><button class="close" onclick="closeOverlay()">×</button></div><div class="seller-banner" style="margin-top:18px"><h3>${name}</h3><p>Votre livreur TekaSafe est en route vers Gombe. Heure estimée : 18 minutes.</p></div><div class="track" style="justify-content:space-between;margin-top:38px"><i class="step done"></i><i class="step done"></i><i class="step done"></i><i class="step"></i></div><div class="track-labels"><span>Confirmée</span><span>Prépare</span><span>En route</span><span>Livrée</span></div><div class="summary"><div class="sumrow"><span>Livreur</span><strong>TekaLivraison · 4,9 ★</strong></div><div class="sumrow"><span>Code à donner à réception</span><strong style="letter-spacing:3px;color:var(--orange)">6 2 8 4</strong></div></div><button class="primary full" onclick="openChat('TekaLivraison','🛵')">Contacter le livreur</button></section></div>`;render()}
    function openChat(name,emoji){state.overlay=`<div class="overlay"><section class="sheet"><div class="handle"></div><div class="chat-header"><button class="back" onclick="closeOverlay()">‹</button><span class="avatar">${emoji}</span><span><h2>${name} <span class="verified">✓</span></h2><p>En ligne</p></span></div><div id="chat-log"><div class="bubble in">Bonjour Jean-Marc 👋 Comment puis-je vous aider ?</div><div class="bubble out">Bonjour, le produit est-il toujours disponible ?</div><div class="bubble in">Oui, il est disponible. Vous pouvez commander en toute sécurité sur TekaSafe.</div></div><div class="chat-input"><input id="chat-text" placeholder="Écrire un message" onkeydown="if(event.key==='Enter')sendChat()"><button onclick="sendChat()">➤</button></div></section></div>`;render();setTimeout(()=>document.getElementById('chat-text')?.focus(),80)}
    async function sendChat(){const input=document.getElementById('chat-text');const value=input?.value.trim();if(!value)return;document.getElementById('chat-log').insertAdjacentHTML('beforeend',`<div class="bubble out">${value.replace(/[<>]/g,'')}</div>`);input.value='';try{if(apiOnline&&state.token)await api('/api/messages',{method:'POST',body:JSON.stringify({recipient:'Vendeur TekaSafe',text:value})})}catch(error){console.warn(error)}}
    function listingForm(p={name:'',price:'',category:'Mode',area:'Gombe',year:'',km:'',fuel:'Essence',gearbox:'Automatique',description:''},editing=false){const opts=categories.map(c=>`<option ${p.category===c[1]?'selected':''}>${c[1]}</option>`).join('');return `<div style="display:grid;gap:12px;margin-top:18px"><input id="listing-name" class="search" style="margin:0" value="${p.name}" placeholder="Titre de l’annonce"><input id="listing-price" class="search" style="margin:0" inputmode="numeric" value="${p.price}" placeholder="Prix en CDF"><select id="listing-category" class="search" style="margin:0" onchange="toggleVehicleFields(this.value)">${opts}</select><select id="listing-area" class="search" style="margin:0"><option ${p.area==='Gombe'?'selected':''}>Gombe</option><option ${p.area==='Ngaliema'?'selected':''}>Ngaliema</option><option ${p.area==='Limete'?'selected':''}>Limete</option><option ${p.area==='Kintambo'?'selected':''}>Kintambo</option><option ${p.area==='Lemba'?'selected':''}>Lemba</option></select><div id="vehicle-fields" class="${p.category==='Automobile'?'':'hidden'}" style="display:grid;gap:12px"><input id="listing-year" class="search" style="margin:0" value="${p.year||''}" placeholder="Année (ex. 2017)"><input id="listing-km" class="search" style="margin:0" value="${p.km||''}" placeholder="Kilométrage (ex. 82 000)"><select id="listing-fuel" class="search" style="margin:0"><option ${p.fuel==='Essence'?'selected':''}>Essence</option><option ${p.fuel==='Diesel'?'selected':''}>Diesel</option><option ${p.fuel==='Hybride'?'selected':''}>Hybride</option></select><select id="listing-gearbox" class="search" style="margin:0"><option ${p.gearbox==='Automatique'?'selected':''}>Automatique</option><option ${p.gearbox==='Manuelle'?'selected':''}>Manuelle</option></select></div><textarea id="listing-description" class="search" style="margin:0;height:88px;padding:13px" placeholder="Description, état et informations vérifiées">${p.description||''}</textarea><input class="search" style="margin:0" type="file" accept="image/*" aria-label="Photo principale"><button class="primary full" onclick="saveListing(${editing?p.id:'null'})">${editing?'Enregistrer les modifications':'Publier l’annonce'}</button></div>`}
    function openAddProduct(){state.overlay=`<div class="overlay"><section class="sheet"><div class="handle"></div><div class="sheet-header"><h2>Ajouter une annonce</h2><button class="close" onclick="closeOverlay()">×</button></div>${listingForm()}</section></div>`;render()}
    function openProductEditor(id){const p=products.find(x=>x.id===id);state.overlay=`<div class="overlay"><section class="sheet"><div class="handle"></div><div class="sheet-header"><h2>Mettre à jour l’annonce</h2><button class="close" onclick="closeOverlay()">×</button></div>${listingForm(p,true)}</section></div>`;render()}
    function toggleVehicleFields(category){document.getElementById('vehicle-fields')?.classList.toggle('hidden',category!=='Automobile')}
    function clean(v){return String(v||'').replace(/[<>]/g,'').trim()}
    async function saveListing(id){if(!apiOnline||!state.token){showToast('Connectez-vous au serveur pour enregistrer une annonce.');return}const name=clean(document.getElementById('listing-name')?.value);const price=Number(String(document.getElementById('listing-price')?.value||'').replace(/[^0-9]/g,''));const category=clean(document.getElementById('listing-category')?.value);if(!name||!price){showToast('Ajoutez un titre et un prix');return}const vehicle=category==='Automobile';const data={name,price,category,area:clean(document.getElementById('listing-area')?.value)||'Gombe',vehicle,year:clean(document.getElementById('listing-year')?.value),km:clean(document.getElementById('listing-km')?.value),fuel:clean(document.getElementById('listing-fuel')?.value)||'Essence',gearbox:clean(document.getElementById('listing-gearbox')?.value)||'Automatique',description:clean(document.getElementById('listing-description')?.value),emoji:vehicle?'🚙':'🛍️',tone:vehicle?'green':'peach',tag:vehicle?'À vérifier':'Nouvelle annonce',delivery:vehicle?'Sur rendez-vous':'Aujourd’hui',seller:vehicle?'Auto Kin RDC':'Kin Tech Store',rating:'4,9',sales:0,stock:vehicle?1:5,usd:Math.round(price/2880)};try{if(apiOnline&&state.token){const remote=await api(id?'/api/listings/'+id:'/api/listings',{method:id?'PATCH':'POST',body:JSON.stringify(data)});if(id)products=products.map(product=>product.id===id?remote.listing:product);else products.unshift(remote.listing)}saveProducts();state.overlay=null;state.role='Vendeur';state.screen='profile';render();showToast(id?'Annonce mise à jour':'Annonce publiée')}catch(error){showToast(error.message)}}
    function showToast(message){let t=document.querySelector('.toast');if(t)t.remove();t=document.createElement('div');t.className='toast';t.textContent=message;document.body.appendChild(t);setTimeout(()=>t.remove(),2800)}
    function resetDemo(){try{localStorage.removeItem('tekasafe-products')}catch{}products=structuredClone(seedProducts);state.screen='home';state.cart=[];state.overlay=null;state.role='Acheteur';state.search='';render();showToast('Démo réinitialisée')}
    function welcome(step=0){const steps=[['Achetez sans crainte','Des vendeurs vérifiés et des prix transparents.'],['Payez à votre rythme','Mobile Money ou paiement à la livraison.'],['Recevez et confirmez','Partagez votre code uniquement après vérification.']];const s=steps[step];app.innerHTML=`<section class="welcome"><div class="welcome-mark">✓</div><div class="phone-box"><div class="onboard-dots">${steps.map((_,i)=>`<i class="${i===step?'active':''}"></i>`).join('')}</div><h1>${s[0]}</h1><p>${s[1]}</p></div><div class="welcome-art"></div><button class="primary" onclick="${step<2?`welcome(${step+1})`:'auth()'}">${step<2?'Continuer':'Créer mon compte'}</button><button class="skip" onclick="exploreCatalog()">Explorer le catalogue</button></section>`}
    async function exploreCatalog(){try{await loadOperationalData();go('home')}catch(error){showToast('Le catalogue est indisponible. Réessayez dans quelques instants.')}}
    function auth(){app.innerHTML=`<section class="welcome"><div class="welcome-mark">✓</div><div class="phone-box"><h1>Bienvenue sur TekaSafe</h1><p>Entrez votre numéro pour recevoir votre code de connexion.</p><label>Numéro de téléphone</label><input id="phone" type="tel" value="" placeholder="+243 81 000 00 00"><button class="primary" style="margin-top:22px" onclick="otp()">Recevoir un code</button><p class="tiny">La connexion par SMS est en préparation. Vous pouvez explorer les annonces sans compte.</p><button class="skip" onclick="exploreCatalog()">Explorer le catalogue</button></div></section>`}
    async function otp(){state.phone=document.getElementById('phone')?.value.trim()||'';try{if(apiOnline){const result=await api('/api/auth/request-otp',{method:'POST',body:JSON.stringify({phone:state.phone})});state.demoCode=result.demoCode||'1234'}}catch(error){showToast(error.message);return}app.innerHTML=`<section class="welcome"><div class="welcome-mark">✓</div><div class="phone-box"><h1>Vérifiez votre numéro</h1><p>Code de démonstration : <b>${state.demoCode}</b></p><div class="otp">${[1,2,3,4].map(i=>`<input maxlength="1" inputmode="numeric" aria-label="Chiffre ${i}">`).join('')}</div><button class="primary" onclick="startApp()">Valider le code</button><button class="skip" onclick="auth()">Modifier le numéro</button></div></section>`}
    async function startApp(){const code=[...document.querySelectorAll('.otp input')].map(input=>input.value).join('');if(!/^\d{4}$/.test(code)){showToast('Saisissez les quatre chiffres du code.');return}if(!apiOnline){showToast('Ouvrez l’application depuis son serveur pour vous connecter.');return}try{const result=await api('/api/auth/verify',{method:'POST',body:JSON.stringify({phone:state.phone,code})});state.token=result.token;try{localStorage.setItem('tekasafe-token',state.token)}catch{}await loadOperationalData();state.screen='home';render();showToast('Connexion réussie.')}catch(error){showToast(error.message)}}
    welcome();
    if('serviceWorker' in navigator){
      if(location.hostname==='127.0.0.1'||location.hostname==='localhost'){
        navigator.serviceWorker.getRegistrations().then(registrations=>registrations.forEach(registration=>registration.unregister()));
      }else if(location.protocol!=='file:'){
        navigator.serviceWorker.register('sw.js').catch(()=>{});
      }
    }
  </script>
</body>
</html>
